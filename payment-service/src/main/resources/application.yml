server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/payment
    password: postgres
    username: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
  flyway:
    enabled: true
    locations: classpath:db/migration

integrations:
  clients:
    product-client:
      url: "http://localhost:8080"
      connect-timeout: 5s
      read-timeout: 10s